version: '3.9'
services:
  api:
    image: 'ghcr.io/shba007/unai-api:latest'
    env_file:
      - .env.prod
    ports:
      - 2300:3000
    networks:
      - front-tier
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  front-tier:
    driver: overlay
