[project]
name = "unai-api"
version = "0.3.1"
description = "AI Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "httpx>=0.28.1",
    "numpy>=2.0.2",
    "opencv-contrib-python-headless>=4.10.0.84",
    "pillow>=11.1.0",
    "pydantic-settings>=2.7.1",
    "pydantic>=2.10.4",
    "scipy>=1.14.1",
    "nanoid>=2.0.0",
    "sqlmodel>=0.0.24",
]

[project.urls]
Source = "https://github.com/shba007/unai-api.git"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.5",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
dev = "fastapi dev server/main.py"
lint = "ruff check --fix"
format = "ruff format"
preview = "fastapi run server/main.py"
docker-build = "docker build --build-arg VERSION_TAG=dev -t unai-api:dev ."
docker-start = "docker run --detach --name unai-api-dev --env-file .env.prod -p 2300:8000 unai-api:dev"
